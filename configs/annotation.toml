[source]
dataset = "Amazon Reviews 2023"
provider = "McAuley Lab"
annotation_scope = "sampled_sentence_or_clause_units"
annotation_covers_entire_corpus = false

[usage]
llm_pseudo_test_is_held_out = true
llm_labels_in_recommendation_training = false
llm_silver_in_optional_nlp_training = true
recommendation_interactions_from_source = true
llm_labels_are_human_gold = false

[development_pilot]
optional = true
split_role = "development_pilot"
label_status = "llm_silver"
allowed_uses = ["refine_guideline", "refine_prompt", "select_model_settings", "debug_errors"]

[llm_pseudo_test]
split_role = "llm_pseudo_test"
label_status = "llm_pseudo_test"
frozen_before_tuning = true
allowed_uses = ["aspect_consistency", "sentiment_consistency", "evidence_consistency"]
tuning_allowed = false
prompt_selection_allowed = false

[annotation]
source_text_hash = "sha256"
required_cutoff_format = "ISO-8601-with-timezone"
split_group_keys = ["parent_asin", "duplicate_group"]
