[ontology.gameplay]
definition = "Cơ chế chơi, nhịp độ, độ cuốn hút và cảm giác chơi."

[ontology.story]
definition = "Cốt truyện, nhân vật, hội thoại và cách kể chuyện."

[ontology.graphics]
definition = "Hình ảnh, phong cách thị giác, animation và chất lượng trình bày."

[ontology.performance]
definition = "Tốc độ, lỗi, crash, lag, độ ổn định và yêu cầu phần cứng."

[ontology.controls]
definition = "Điều khiển, thao tác, input mapping và độ phản hồi."

[ontology.multiplayer]
definition = "Chơi online/local cùng người khác, matchmaking và cộng đồng trong game."

[ontology.content_replay]
definition = "Lượng nội dung, độ dài, endgame và giá trị chơi lại."

[ontology.value]
definition = "Mức đáng tiền hoặc đáng với thời gian bỏ ra; không đồng nhất với giá thấp."

[labeling]
unit = "sentence_or_clause"
sentiments = ["positive", "negative", "neutral"]
allow_out_of_scope = true
duplicate_group_must_share_split = true

[llm_data_usage]
source = "Amazon Reviews 2023 by McAuley Lab"
development_split_role = "development_pilot"
development_label_status = "llm_silver"
pseudo_test_split_role = "llm_pseudo_test"
pseudo_test_label_status = "llm_pseudo_test"
llm_pseudo_test_in_model_training = false
llm_labels_in_recommendation_training = false
llm_silver_in_optional_nlp_training = true
llm_labels_are_human_gold = false
pseudo_test_frozen_before_tuning = true
annotation_covers_entire_corpus = false
