[protocol]
name = "global-temporal-v1"
protocol_version = "evaluation-v1"
primary_metric = "ndcg@10"
ks = [5, 10, 20]
positive_target_rating = 4
target_split = "recommendation_test"
candidate_rule = "known_items_before_cutoff_minus_user_history"
ranking_artifact_format = "jsonl_per_user"

[slices]
user_history = ["1-2", "3-5", ">5"]
item_support = ["low", "high"]
popularity = ["low", "medium", "high"]

[uncertainty]
seeds = [7, 17, 27]
bootstrap = "paired_user_bootstrap"
bootstrap_samples = 2000
confidence_level = 0.95

[explanations]
audit_recommendations = 100
max_claims = 200
