[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trustrec"
version = "0.1.0"
description = "Evidence-aware product recommendation with aspect opinions and interaction graphs"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "duckdb>=1.0",
  "numpy>=1.26",
  "pandas>=2.2",
  "pyarrow>=16.0",
  "scikit-learn>=1.5",
  "scipy>=1.13",
  "streamlit>=1.36",
]

[project.optional-dependencies]
dev = [
  "pre-commit>=3.7",
  "pytest>=8.2",
  "pytest-cov>=5.0",
  "ruff>=0.6",
]
laya = ["laya==0.3.23"]

[project.scripts]
trustrec = "trustrec.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
